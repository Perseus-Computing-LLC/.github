<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Telamon Cognitive Infrastructure system</title>
  <desc id="desc">Harpe resolves verified context, Kibisis keeps durable memory, and Argus records verifiable evidence.</desc>
  <rect width="1600" height="560" fill="#101316"/>
  <path d="M0 82H1600M0 478H1600" stroke="#30363d" stroke-width="1"/>
  <path d="M76 0V560M1524 0V560" stroke="#30363d" stroke-width="1"/>
  <text x="76" y="74" fill="#e9e3d8" font-family="Georgia, serif" font-size="28" letter-spacing="1">THE TELAMON SYSTEM</text>
  <text x="76" y="108" fill="#9ba3aa" font-family="Arial, sans-serif" font-size="18">Three independent tools. One inspectable path from state to knowledge to evidence.</text>

  <path d="M324 302H590M1010 302H1276" stroke="#d5a544" stroke-width="3" stroke-linecap="round"/>
  <circle cx="457" cy="302" r="7" fill="#d5a544"/>
  <circle cx="1143" cy="302" r="7" fill="#d5a544"/>

  <g transform="translate(76 174)">
    <rect width="248" height="248" rx="5" fill="#151b22" stroke="#7e9bbe" stroke-width="2"/>
    <path d="M42 162H204M123 80V204M64 112L182 176M64 176L182 112" stroke="#7e9bbe" stroke-width="1.5" opacity=".8"/>
    <circle cx="123" cy="144" r="14" fill="#d5a544"/>
    <circle cx="123" cy="144" r="5" fill="#151b22"/>
    <text x="28" y="42" fill="#d5a544" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">01 / CONTEXT</text>
    <text x="28" y="226" fill="#f2eee7" font-family="Georgia, serif" font-size="27">Harpe</text>
  </g>
  <text x="76" y="462" fill="#b8c0c7" font-family="Arial, sans-serif" font-size="17">Resolve the verified workspace state</text>
  <text x="76" y="488" fill="#b8c0c7" font-family="Arial, sans-serif" font-size="17">an agent needs before it acts.</text>

  <g transform="translate(590 174)">
    <rect width="420" height="248" rx="5" fill="#151b22" stroke="#6ca88b" stroke-width="2"/>
    <rect x="83" y="67" width="254" height="36" rx="3" fill="#24392f" stroke="#6ca88b"/>
    <rect x="83" y="111" width="254" height="36" rx="3" fill="#20342b" stroke="#6ca88b"/>
    <rect x="83" y="155" width="254" height="36" rx="3" fill="#1c2f27" stroke="#6ca88b"/>
    <circle cx="112" cy="85" r="6" fill="#d5a544"/><circle cx="112" cy="129" r="6" fill="#d5a544"/><circle cx="112" cy="173" r="6" fill="#d5a544"/>
    <text x="28" y="42" fill="#6ca88b" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">02 / MEMORY</text>
    <text x="28" y="226" fill="#f2eee7" font-family="Georgia, serif" font-size="27">Kibisis</text>
  </g>
  <text x="590" y="462" fill="#b8c0c7" font-family="Arial, sans-serif" font-size="17">Keep encrypted, durable, time-valid</text>
  <text x="590" y="488" fill="#b8c0c7" font-family="Arial, sans-serif" font-size="17">knowledge in a portable local store.</text>

  <g transform="translate(1276 174)">
    <rect width="248" height="248" rx="5" fill="#1d1912" stroke="#d5a544" stroke-width="2"/>
    <rect x="42" y="73" width="164" height="112" rx="2" fill="#292113" stroke="#d5a544"/>
    <path d="M72 107H176M72 133H176M72 159H142" stroke="#e8d7a5" stroke-width="2" stroke-linecap="round"/>
    <circle cx="177" cy="177" r="16" fill="#d5a544"/><path d="M170 177l5 5 10-12" fill="none" stroke="#1d1912" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="42" fill="#d5a544" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">03 / EVIDENCE</text>
    <text x="28" y="226" fill="#f2eee7" font-family="Georgia, serif" font-size="27">Argus</text>
  </g>
  <text x="1276" y="462" fill="#b8c0c7" font-family="Arial, sans-serif" font-size="17">Record what happened with</text>
  <text x="1276" y="488" fill="#b8c0c7" font-family="Arial, sans-serif" font-size="17">hash-chained, verifiable evidence.</text>
</svg>
